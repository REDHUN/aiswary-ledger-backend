spring.application.name=aiswarya-ledger-api-test

# H2 in-memory mode for unit and integration testing
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA / Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false

# Flyway Migration Configuration
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# Security / JWT Configuration
jwt.secret=9a2f8c4e7b1d3f5a8e0c2b4d6f8a1e3c5b7d9f0a2b4c6e8f1a3b5c7d9e0f2a4b
jwt.expiration.ms=86400000

logging.level.com.redhun.aiswarya_ledger_api=INFO
