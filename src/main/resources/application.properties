spring.application.name=aiswarya-ledger-api
server.port=8080

# PostgreSQL Database Configuration
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/aiswaryadb}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Flyway Migration Configuration
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.repair-on-migrate=true
spring.flyway.validate-on-migrate=false
spring.flyway.clean-on-validation-error=false
spring.flyway.clean-disabled=true
spring.flyway.locations=classpath:db/migration

# Security / JWT Configuration
jwt.secret=9a2f8c4e7b1d3f5a8e0c2b4d6f8a1e3c5b7d9f0a2b4c6e8f1a3b5c7d9e0f2a4b
jwt.expiration.ms=86400000

# Logging
logging.level.com.redhun.aiswarya_ledger_api=INFO
